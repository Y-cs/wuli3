services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: order_it
      MYSQL_USER: order_it
      MYSQL_PASSWORD: order_it
      MYSQL_ROOT_PASSWORD: order_it_root
    ports:
      - "127.0.0.1:${ORDER_IT_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.4.5
    ports:
      - "127.0.0.1:${ORDER_IT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  nameserver:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 30
  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n nameserver:9876 -c /home/rocketmq/broker.conf --enable-proxy
    environment:
      NAMESRV_ADDR: nameserver:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "127.0.0.1:${ORDER_IT_MQ_PORT:-8081}:8081"
    volumes:
      - ./docker/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      nameserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "./mqadmin clusterList -n nameserver:9876 | grep -q order-it-broker && bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
  initialize:
    image: apache/rocketmq:5.3.2
    profiles: ["tools"]
    environment:
      ORDER_IT_MQ_TOPIC: ${ORDER_IT_MQ_TOPIC:-order_it_events}
      ORDER_IT_MQ_GROUP: ${ORDER_IT_MQ_GROUP:-order_it_acceptance}
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        ./mqadmin updateTopic -n nameserver:9876 -b broker:10911 -t "$$ORDER_IT_MQ_TOPIC" -a +message.type=NORMAL &&
        ./mqadmin updateSubGroup -n nameserver:9876 -b broker:10911 -g "$$ORDER_IT_MQ_GROUP"
volumes:
  mysql-data:
