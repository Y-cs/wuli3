spring:
  application:
    name: order-service-integration-test
  datasource:
    url: ${ORDER_IT_MYSQL_URL:jdbc:mysql://${ORDER_IT_MYSQL_HOST:localhost}:${ORDER_IT_MYSQL_PORT:3307}/${ORDER_IT_MYSQL_DATABASE:order_it}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ORDER_IT_MYSQL_USER:order_it}
    password: ${ORDER_IT_MYSQL_PASSWORD:order_it}
  sql:
    init:
      mode: ${ORDER_IT_SQL_INIT_MODE:always}
  data:
    redis:
      host: ${ORDER_IT_REDIS_HOST:localhost}
      port: ${ORDER_IT_REDIS_PORT:6380}
it:
  order:
    resource-prefix: ${ORDER_IT_RESOURCE_PREFIX:order-it}
    topic: ${ORDER_IT_MQ_TOPIC:order_it_events}
wuli3:
  rocketmq:
    v5:
      endpoints: ${ORDER_IT_MQ_ENDPOINT:localhost:8081}
      topics:
        - ${it.order.topic}
      ssl-enabled: false
