<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
  <title id="title">Wuli3 业务架构</title>
  <desc id="desc">HTTP、RPC 与消息入口调用应用用例；用例执行领域规则并通过 Repository、事件及 Gateway 连接外部设施。</desc>
  <rect x="6" y="6" width="468" height="328" rx="20" fill="#142e2d" stroke="#3b6b65"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="240" y="38" fill="#9fc9c2" font-size="11" letter-spacing="3">BOUNDARIES BEFORE FRAMEWORKS</text>
    <g fill="#21433f" stroke="#517971">
      <rect x="32" y="60" width="112" height="44" rx="8"/>
      <rect x="184" y="60" width="112" height="44" rx="8"/>
      <rect x="336" y="60" width="112" height="44" rx="8"/>
      <rect x="84" y="142" width="312" height="54" rx="9"/>
      <rect x="32" y="238" width="112" height="48" rx="8"/>
      <rect x="184" y="238" width="112" height="48" rx="8"/>
      <rect x="336" y="238" width="112" height="48" rx="8"/>
    </g>
    <path d="M88 104v18h152v20m152-38v18H240m0-18v38m0 54v24H88v18m152-18v18m0-18h152v18" fill="none" stroke="#70dac5" stroke-width="2"/>
    <g fill="#eaf4f0" font-size="15">
      <text x="88" y="87">HTTP</text><text x="240" y="87">RPC</text><text x="392" y="87">消息 / 任务</text>
      <text x="240" y="164">应用用例 · 领域规则</text>
      <text x="88" y="268">仓储</text><text x="240" y="268">事件</text><text x="392" y="268">Gateway</text>
    </g>
    <text x="240" y="183" fill="#9fc9c2" font-size="11">输入、身份与上下文在入口确定</text>
    <text x="240" y="315" fill="#9fc9c2" font-size="11">基础设施实现端口，业务决定语义</text>
  </g>
</svg>
