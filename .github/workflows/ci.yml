name: CI

on:
  pull_request:
  # 默认分支生成共享依赖缓存，后续 PR 可直接恢复。
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            testkit/caches

      # build 串联编译、单元测试、Checkstyle、Spotless、SpotBugs、Forbidden APIs、
      # Error Prone/NullAway、JaCoCo 覆盖率校验、javadoc(-Werror) 和打包；
      # :wuli3-build-logic:test 运行约定插件自身的测试。
      # 文档站由 Vercel 在 main 更新后构建，这里排除，避免 PR 触发文档构建。
      - name: Run build and quality gates
        run: ./gradlew --no-daemon clean build -x :wuli3-docs:buildDocs :wuli3-build-logic:test --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
            **/build/reports/jacoco/
          if-no-files-found: ignore
