name: CI

on:
  # 只在 PR 上运行：合并提交已包含 PR 已验证的同一份代码，main 上再跑一遍是重复。
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js for documentation
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wuli3-docs/package-lock.json

      # build 串联编译、单元测试、Checkstyle、Spotless、SpotBugs、Forbidden APIs、
      # Error Prone/NullAway、JaCoCo 覆盖率校验、javadoc(-Werror) 和打包；
      # :wuli3-build-logic:test 运行约定插件自身的测试。
      - name: Run build and quality gates
        run: ./gradlew --no-daemon clean build :wuli3-build-logic:test --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
            **/build/reports/jacoco/
          if-no-files-found: ignore
