name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repository:
        description: 发布目标仓库
        type: choice
        default: central
        options:
          - central
          - github-packages

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.repository == 'central'
    name: Build and publish to central Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 版本号以代码为准 gradle.properties 的 wuli3.version
      # 这里校验 tag 与两个构建解析出的版本都一致，避免 tag 标称的版本和实际发布的版本分叉
      - name: Verify tag matches code version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          main_version=$(./gradlew -q :properties | sed -n 's/^version: //p' | head -1)
          build_logic_version=$(./gradlew -q :wuli3-build-logic:properties | sed -n 's/^version: //p' | head -1)
          status=0
          if [ "$main_version" != "$expected" ]; then
            echo "::error::tag 是 $TAG，但 gradle.properties 的 wuli3.version 是 $main_version"
            status=1
          fi
          if [ "$build_logic_version" != "$expected" ]; then
            echo "::error::tag 是 $TAG，但 wuli3-build-logic 解析出的版本是 $build_logic_version"
            status=1
          fi
          exit $status

      # 未配置的 secret 会以空字符串注入，构建侧按未配置处理会让发布任务不存在
      - name: Check publish secrets
        env:
          RELEASES_URL: ${{ secrets.CENTRAL_MAVEN_RELEASES_URL }}
          SNAPSHOTS_URL: ${{ secrets.CENTRAL_MAVEN_SNAPSHOTS_URL }}
          USERNAME: ${{ secrets.CENTRAL_MAVEN_USERNAME }}
          PASSWORD: ${{ secrets.CENTRAL_MAVEN_PASSWORD }}
        run: |
          missing=""
          for name in RELEASES_URL SNAPSHOTS_URL USERNAME PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::以下 secret 未配置:$missing"
            exit 1
          fi

      # 先过全部质量门禁再发布，避免把未通过检查的产物推进仓库
      - name: Publish
        env:
          CENTRAL_MAVEN_RELEASES_URL: ${{ secrets.CENTRAL_MAVEN_RELEASES_URL }}
          CENTRAL_MAVEN_SNAPSHOTS_URL: ${{ secrets.CENTRAL_MAVEN_SNAPSHOTS_URL }}
          CENTRAL_MAVEN_USERNAME: ${{ secrets.CENTRAL_MAVEN_USERNAME }}
          CENTRAL_MAVEN_PASSWORD: ${{ secrets.CENTRAL_MAVEN_PASSWORD }}
        run: |
          ./gradlew --no-daemon check :wuli3-build-logic:test \
            :wuli3-build-logic:publishAllPublicationsToCentralRepository \
            publishAllPublicationsToCentralRepository

  publish-github-packages:
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'github-packages'
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 两个构建都读取 gradle.properties，避免插件、BOM 与模块版本不一致。
      - name: Verify publication versions
        run: |
          main_version=$(./gradlew -q :properties | sed -n 's/^version: //p' | head -1)
          build_logic_version=$(./gradlew -q :wuli3-build-logic:properties | sed -n 's/^version: //p' | head -1)
          test -n "$main_version"
          test "$main_version" = "$build_logic_version"
          echo "Publishing version: $main_version"

      - name: Run quality gates
        run: ./gradlew --no-daemon check :wuli3-build-logic:test

      # 复用可配置的 Maven 发布端点；仅上传步骤拥有 Packages 临时凭据。
      - name: Publish to GitHub Packages
        env:
          CENTRAL_MAVEN_RELEASES_URL: https://maven.pkg.github.com/${{ github.repository }}
          CENTRAL_MAVEN_SNAPSHOTS_URL: https://maven.pkg.github.com/${{ github.repository }}
          CENTRAL_MAVEN_USERNAME: ${{ github.actor }}
          CENTRAL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon \
            :wuli3-build-logic:publishAllPublicationsToCentralRepository \
            publishAllPublicationsToCentralRepository
