# palantir-java-format 链接 jdk.compiler 内部类（ImportOrderer 引用 Tokens$TokenKind），
# JDK 16+ 强封装下必须显式导出，否则 spotless 格式化步骤报 NoClassDefFoundError。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 发布版本的唯一定义点
wuli3.version=1.0.0

# 约定插件携带的 Kotlin JVM、Lombok 与 Spring 插件版本
wuli3.build.kotlin-version=2.4.20

wuli3.conventions.use-project-bom=true
