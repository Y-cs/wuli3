org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
wuli3.version=1.0.0
wuli3.conventions.bom-coordinates=com.kjs.wuli3:wuli3-dependencies:1.0.0
wuli3.conventions.jacoco.verification.enabled=false
wuli3.conventions.nullaway.annotated-packages=com.example.order

# DDD 架构边界使用单一基础包；事务位置审查按需开启。
wuli3.ddd.base-package=com.example.order
wuli3.ddd.transaction-review.enabled=false
