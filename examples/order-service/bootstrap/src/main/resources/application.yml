spring:
  application:
    name: order-service

application:
  service:
    service-code: order-service

management:
  server:
    port: ${actuator.port:8099}
  endpoint:
    shutdown:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,shutdown
      base-path: /__core

wuli3:
  logging:
    enabled: true
    file:
      enabled: true

logging:
  level:
    com.kjs.wuli3: info